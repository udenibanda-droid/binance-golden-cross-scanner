<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binance Golden Cross Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#e8edf3;font-family:Arial,sans-serif}
header{padding:18px 14px;background:#0b0f14;border-bottom:1px solid #26303b}
h1{font-size:20px;margin:0 0 5px}
.sub{font-size:12px;color:#8995a3}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
select,button{background:#151c25;color:#fff;border:1px solid #303b49;border-radius:9px;padding:10px}
button{font-weight:bold}
main{padding:14px;max-width:900px;margin:auto}
.card{background:#111821;border:1px solid #26313d;border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.symbol{font-size:17px;font-weight:bold}
.badge{background:#183a2a;color:#6ee7a3;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.metric{background:#0c1219;padding:9px;border-radius:9px}
.label{font-size:10px;color:#8290a0}
.value{font-size:13px;margin-top:3px}
.empty{text-align:center;color:#8995a3;padding:35px 10px}
a{color:#78aaff;text-decoration:none}
</style>
</head>

<body>

<header>
<h1>🟢 Binance Golden Cross Scanner</h1>
<div class="sub">Public market data only • No Binance account connection</div>

<div class="controls">
<select id="interval">
<option value="4h">4H</option>
<option value="1d">1D</option>
<option value="1h">1H</option>
<option value="15m">15M</option>
</select>

<select id="quote">
<option value="USDT">USDT</option>
<option value="USDC">USDC</option>
</select>

<button id="scan">🔎 SCAN</button>
</div>

<div id="status" class="sub" style="margin-top:10px">Ready.</div>
</header>

<main>
<div id="results" class="empty">
Press SCAN to find new Golden Crosses.
</div>
</main>

<script>
const API="https://api.binance.com";
const $=x=>document.getElementById(x);

async function getJSON(url){
 const r=await fetch(url);
 if(!r.ok)throw Error("Binance API error "+r.status);
 return r.json();
}

function sma(a,n){
 return a.slice(-n).reduce((x,y)=>x+y,0)/n;
}

async function scan(){

 const interval=$("interval").value;
 const quote=$("quote").value;

 $("scan").disabled=true;
 $("status").textContent="Loading Binance symbols...";
 $("results").innerHTML="";

 try{

  const info=await getJSON(API+"/api/v3/exchangeInfo");

  const symbols=info.symbols.filter(s=>
   s.status==="TRADING" &&
   s.quoteAsset===quote &&
   s.isSpotTradingAllowed
  ).slice(0,120);

  const out=[];
  let done=0;

  for(const s of symbols){

   try{

    const k=await getJSON(
     API+"/api/v3/klines?symbol="+s.symbol+
     "&interval="+interval+"&limit=202"
    );

    if(k.length<202)continue;

    const closed=k.slice(0,-1);
    const closes=closed.map(x=>Number(x[4]));

    const previous=closes.slice(0,-1);

    const p50=sma(previous,50);
    const p200=sma(previous,200);

    const c50=sma(closes,50);
    const c200=sma(closes,200);

    if(c50>c200 && p50<=p200){

     const last=closed[closed.length-1];

     const avgVol=
      closed.slice(-21,-1)
      .reduce((a,x)=>a+Number(x[5]),0)/20;

     const vol=Number(last[5]);

     out.push({
      symbol:s.symbol,
      price:Number(last[4]),
      sma50:c50,
      sma200:c200,
      volume:avgVol?vol/avgVol:0,
      time:last[6]
     });
    }

   }catch(e){}

   done++;

   if(done%10===0)
    $("status").textContent=
     "Scanning "+done+"/"+symbols.length+"...";
  }

  out.sort((a,b)=>b.volume-a.volume);

  render(out);

  $("status").textContent=
   "Finished • "+out.length+
   " Golden Cross signal(s) • "+interval.toUpperCase();

 }catch(e){

  $("status").textContent=e.message;
  $("results").innerHTML=
   '<div class="empty">Could not load Binance data. Try again.</div>';

 }finally{
  $("scan").disabled=false;
 }
}

function render(rows){

 if(!rows.length){
  $("results").innerHTML=
   '<div class="empty">No new Golden Cross found.</div>';
  return;
 }

 $("results").innerHTML=rows.map(x=>`

 <div class="card">

  <div class="row">

   <div>
    <div class="symbol">${x.symbol}</div>
    <div class="sub">${new Date(x.time).toLocaleString()}</div>
   </div>

   <div class="badge">GOLDEN CROSS</div>

  </div>

  <div class="grid">

   <div class="metric">
    <div class="label">PRICE</div>
    <div class="value">${x.price.toLocaleString()}</div>
   </div>

   <div class="metric">
    <div class="label">VOLUME / 20 AVG</div>
    <div class="value">${x.volume.toFixed(2)}×</div>
   </div>

   <div class="metric">
    <div class="label">50 SMA</div>
    <div class="value">${x.sma50.toFixed(6)}</div>
   </div>

   <div class="metric">
    <div class="label">200 SMA</div>
    <div class="value">${x.sma200.toFixed(6)}</div>
   </div>

  </div>

  <div style="margin-top:12px">
   <a target="_blank"
   href="https://www.binance.com/en/trade/${x.symbol.replace("USDT","_USDT")}">
   Open Binance Chart ↗
   </a>
  </div>

 </div>

 `).join("");
}

$("scan").onclick=scan;
</script>

</body>
</html>
